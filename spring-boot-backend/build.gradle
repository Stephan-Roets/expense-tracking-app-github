plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'za.co.fleetexpense'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    
    // Database
    implementation 'org.postgresql:postgresql:42.7.4'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    
    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    
    // Utilities
    implementation 'org.mapstruct:mapstruct:1.6.2'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.2'
    
    // OpenAPI Documentation
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    // Export/Reporting - Multi-Format SARS Submission
    // Apache POI for Excel (.xlsx) workbook assembly
    implementation 'org.apache.poi:poi-ooxml:5.2.5'

    // Spring Thymeleaf for HTML reporting and PDF preview templating
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // OpenHTMLtoPDF for converting parsed Thymeleaf HTML strings into locked PDFs
    implementation 'io.github.openhtmltopdf:openhtmltopdf-pdfbox:1.1.37'
    // Add SVG support for PDF generation
    implementation 'io.github.openhtmltopdf:openhtmltopdf-svg-support:1.1.37'
    // Add image format support for PDF generation (WEBP, AVIF)
    implementation 'com.twelvemonkeys.imageio:imageio-webp:3.10.1'
    implementation 'org.apache.commons:commons-imaging:1.0-alpha3'

    // Dotenv for environment variables
    implementation 'me.paulschwarz:spring-dotenv:4.0.0'

    // Brevo Email Service
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    // OCI Object Storage - Using Swift-compatible REST API with Customer Secret Key
    // No additional dependencies needed - using Spring's RestTemplate

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    
    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform()
}

